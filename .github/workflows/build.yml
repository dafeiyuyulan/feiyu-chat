name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: 补齐安卓脚手架
        run: |
          flutter create --platforms=android --project-name feiyu_chat .
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="feiyu_chat"/android:label="肥鱼小窝"/' "$MAN"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' "$MAN"
          grep -n "INTERNET\|usesCleartextTraffic\|android:label" "$MAN"

      - name: 换图标
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/icon.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              im.resize((s, s), Image.LANCZOS).save(f'android/app/src/main/res/mipmap-{d}/ic_launcher.png')
          print('图标换好了')
          PY
          ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: 配固定签名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/feiyu.jks
          printf 'storeFile=feiyu.jks\nstorePassword=%s\nkeyAlias=feiyu\nkeyPassword=%s\n' "$KEYSTORE_PASS" "$KEYSTORE_PASS" > android/key.properties
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
          s = s.replace('    buildTypes {', '''    signingConfigs {
              create("release") {
                  val kp = Properties()
                  val f = rootProject.file("key.properties")
                  if (f.exists()) kp.load(FileInputStream(f))
                  keyAlias = kp["keyAlias"] as String
                  keyPassword = kp["keyPassword"] as String
                  storeFile = file(kp["storeFile"] as String)
                  storePassword = kp["storePassword"] as String
              }
          }

    buildTypes {''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          print('签名配置完成')
          PY
          grep -n "signingConfig" android/app/build.gradle.kts

      - name: 拉依赖
        run: flutter pub get

      - name: 编 release apk
        run: flutter build apk --release

      - name: 传上去
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
