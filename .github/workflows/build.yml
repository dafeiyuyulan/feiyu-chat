name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: 补齐安卓脚手架
        run: |
          flutter create --platforms=android --project-name feiyu_chat .
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="feiyu_chat"/android:label="肥鱼小窝"/' "$MAN"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' "$MAN"
          grep -n "INTERNET\|usesCleartextTraffic\|android:label" "$MAN"

      - name: 换图标
        run: |
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"
            s="${pair##*:}"
            convert "assets/icon.png" -resize "${s}x${s}" "android/app/src/main/res/mipmap-${d}/ic_launcher.png"
          done
          ls -l android/app/src/main/res/mipmap-xxxhdpi/

      - name: 拉依赖
        run: flutter pub get

      - name: 编 release apk
        run: flutter build apk --release

      - name: 传上去
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
